name: Build native Windows app
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/**'
      - 'public/**'
      - 'db/**'
      - 'package.json'
      - '.github/workflows/build-native.yml'

jobs:
  build:
    runs-on: windows-latest
    env:
      PUBLISH_DIR: native/publish/win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Restore
        working-directory: native
        run: dotnet restore Udc.sln

      - name: Build Udc.Client (the testable, non-UI part)
        working-directory: native
        run: dotnet build src/Udc.Client/Udc.Client.csproj -c Release --no-restore

      - name: Test Udc.Client
        working-directory: native
        run: dotnet test src/Udc.Client.Tests/Udc.Client.Tests.csproj -c Release --no-restore

      - name: Publish Udc.App (self-contained win-x64)
        run: dotnet publish native/src/Udc.App/Udc.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ${{ env.PUBLISH_DIR }}

      - name: Stage the backend (build + portable Node.js runtime) next to Udc.App.exe
        run: node native/scripts/prepare-backend.cjs ${{ env.PUBLISH_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: urban-dry-clean-crm-native-win-x64
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
