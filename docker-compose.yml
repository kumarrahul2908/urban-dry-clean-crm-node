services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: udc
    ports: ["3307:3306"]
    volumes:
      - dbdata:/var/lib/mysql
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  dbdata:
