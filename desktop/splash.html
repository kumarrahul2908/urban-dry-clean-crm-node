<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Urban Dry Clean CRM</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #0b3d91, #1857c9);
    color: #fff; -webkit-app-region: drag; user-select: none;
  }
  .badge {
    width: 72px; height: 72px; border-radius: 18px;
    background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; letter-spacing: .5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; opacity: .95; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.3); border-top-color: #00b4d8;
    animation: spin 0.9s linear infinite;
  }
  #status { font-size: 12.5px; opacity: .8; min-height: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="badge">UDC</div>
  <h1>Urban Dry Clean CRM</h1>
  <div class="spinner"></div>
  <div id="status">Starting up&hellip;</div>
  <script>
    if (window.udcSplash) {
      window.udcSplash.onStatus((text) => {
        document.getElementById('status').textContent = text;
      });
    }
  </script>
</body>
</html>
