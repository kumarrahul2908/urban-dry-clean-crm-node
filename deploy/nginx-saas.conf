# SaaS mode: ONE wildcard vhost serves every business (<slug>.apps.example.com) and the signup host; Node picks the business from the Host header.
# Wildcard TLS needs a DNS-01 certificate:  certbot certonly --manual --preferred-challenges dns -d 'apps.example.com' -d '*.apps.example.com'
# (or a DNS plugin for your DNS provider so it renews automatically). DNS: A record  *.apps  and  apps  ->  this server.
server {
    listen 443 ssl;
    server_name apps.example.com *.apps.example.com;      # apps.example.com = CONTROL_ROOT_HOST (signup page)
    ssl_certificate     /etc/letsencrypt/live/apps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.example.com/privkey.pem;
    client_max_body_size 110m;

    # uploads of every business: /var/www/udc/uploads/<slug>/...   (nginx maps the subdomain to the folder)
    location ~ ^/uploads/(.+)$ {
        if ($host ~ ^([a-z0-9-]+)\.apps\.example\.com$) { set $slug $1; }
        alias /var/www/udc/uploads/$slug/$1;
        add_header X-Content-Type-Options nosniff;
        add_header Cross-Origin-Resource-Policy cross-origin;
        autoindex off;
    }
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server { listen 80; server_name apps.example.com *.apps.example.com; return 301 https://$host$request_uri; }
